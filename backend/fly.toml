# Fly.io config for the Sermon Notes backend.
# First time:  fly launch --no-deploy --copy-config   (or `fly apps create sermon-notes-backend`)
# Then set secrets (see backend/README.md) and:  fly deploy

app = "sermon-notes-backend"
primary_region = "iad"   # pick one near your congregation; `fly platform regions`

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
