# Render Blueprint for the Sermon Notes backend.
# Render deploys from a connected Git repo (GitHub / GitLab / Bitbucket — a
# private repo is fine). In the Render dashboard: New > Blueprint > pick this
# repo. Then set DEEPGRAM_API_KEY and GEMINI_API_KEY under the service's
# Environment tab (they are marked sync:false so they are never committed).
services:
  - type: web
    name: sermon-notes-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: STT_PROVIDER
        value: deepgram
      - key: SUMMARIZER_PROVIDER
        value: gemini
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
